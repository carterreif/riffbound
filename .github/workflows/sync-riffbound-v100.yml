name: Sync verified Riffbound version 100 source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-riffbound-v100.yml']
permissions:
  contents: write
concurrency:
  group: riffbound-source-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore source and verify every tracked source file
        shell: python
        run: |
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.request
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.riffbound-sync/manifest.json').read_text())
          assert manifest['version'] == 100
          allowed = {f['path']: f for f in manifest['files']}
          def target(name):
              p = pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] in ('.git', '.github', '.riffbound-sync'):
                  raise RuntimeError('Invalid source path: ' + name)
              return root.joinpath(*p.parts)
          data = base64.b64decode((root / '.riffbound-sync/source.tar.xz.b64').read_text(), validate=False)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              for member in archive:
                  if member.name not in allowed or not member.isfile() or member.size != allowed[member.name]['size']:
                      raise RuntimeError('Invalid source archive member')
                  p = target(member.name)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(archive.extractfile(member).read())
          base = 'https://riffbound.aaronreifschneider.chatgpt.site/'
          for name in manifest['downloads']:
              if name not in allowed or not name.startswith('dist/demos/') or not name.endswith('.mp3'):
                  raise RuntimeError('Unexpected asset')
              expected = allowed[name]
              req = urllib.request.Request(base + name[5:], headers={'User-Agent': 'Riffbound-v100-source-sync'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  if response.status != 200:
                      raise RuntimeError('Asset unavailable')
                  data = response.read(expected['size'] + 1)
              if len(data) != expected['size'] or hashlib.sha256(data).hexdigest() != expected['sha256']:
                  raise RuntimeError('Asset differs from the verified source: ' + name)
              p = target(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          for name, expected in allowed.items():
              p = target(name)
              data = p.read_bytes()
              if len(data) != expected['size'] or hashlib.sha256(data).hexdigest() != expected['sha256']:
                  raise RuntimeError('Source mismatch: ' + name)
              p.chmod(int(expected['mode'], 8) & 0o777)
          print('Verified all', len(allowed), 'source files for version', manifest['version'], manifest['source_commit'])
      - name: Check runtime and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/*.js; do node --check "$file"; done
          node --test tests/direct-pack-search.test.cjs tests/community-packs.test.cjs tests/title-only-search.test.cjs tests/bundled-song-audio.test.cjs tests/community-charts.test.cjs tests/automatic-updates.test.cjs tests/storage-offline.test.cjs
      - name: Commit the complete source and remove one-time sync files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .riffbound-sync
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sync complete Riffbound version 100 source' -m 'Source snapshot: b1a16ae74514759faaf4579290c9a3403bec7914. Verified every source file and asset against SHA-256 receipts; retain existing GitHub history and workflows.'
          git push origin HEAD:main
