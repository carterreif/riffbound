name: Import Riffbound v31 source extras

# Retry after validating all staged archive segments.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-riffbound-source.yml'

jobs:
  import-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and extract source extras
        shell: bash
        run: |
          set -euo pipefail
          cat .riffbound-import/part*.b64 | base64 -d > /tmp/riffbound-source.tar.xz
          python - <<'PY'
          import tarfile
          with tarfile.open('/tmp/riffbound-source.tar.xz', 'r:xz') as archive:
              archive.extractall('.')
          PY
          rm -rf .riffbound-import

      - name: Commit full source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Riffbound v31 development source"
          git push origin HEAD:main
